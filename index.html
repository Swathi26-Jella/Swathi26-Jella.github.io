<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mein Deutsch-Lernjournal</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-content">

            <h1>🇩🇪 Mein Deutsch-Lernjournal</h1>

            <p class="header-description">
                Wortschatz lernen · Üben · Wiederholen
            </p>

            <p class="subtitle">
                📚 Wörter &nbsp; • &nbsp;
                🧠 Themen &nbsp; • &nbsp;
                📅 Tägliches Lernen
            </p>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <!-- =========================
             ADD WORD BUTTON
        ========================== -->

        <section class="add-section">

            <button
                class="add-button"
                onclick="showAddWords()"
            >
                ➕ Neue Wörter hinzufügen
            </button>

        </section>



        <!-- =========================
             ADD WORD FORM
        ========================== -->

        <section
            id="addWordsForm"
            class="add-words-form"
            style="display: none;"
        >

            <h2>📚 Neue Wörter hinzufügen</h2>


            <!-- DATE -->

            <div class="form-group">

                <label for="wordDate">
                    📅 Datum
                </label>

                <input
                    type="date"
                    id="wordDate"
                >

            </div>


            <!-- TOPIC -->

            <div class="form-group">

                <label for="wordTopic">
                    🧠 Thema
                </label>

                <input
                    type="text"
                    id="wordTopic"
                    placeholder="z. B. Embedded Systems"
                >

            </div>



            <!-- WORD TABLE -->

            <div class="word-input-table">


                <div class="table-header">

                    <div>🇩🇪 Deutsch</div>

                    <div>🇬🇧 English</div>

                    <div>Plural</div>

                    <div>💬 Beispiel</div>

                </div>



                <!-- WORD 1 -->

                <div class="word-row">

                    <input type="text" id="german1"
                        placeholder="der Parameter">

                    <input type="text" id="english1"
                        placeholder="parameter">

                    <input type="text" id="plural1"
                        placeholder="die Parameter">

                    <input type="text" id="example1"
                        placeholder="Der Parameter ist wichtig.">

                </div>



                <!-- WORD 2 -->

                <div class="word-row">

                    <input type="text" id="german2"
                        placeholder="Deutsch">

                    <input type="text" id="english2"
                        placeholder="English">

                    <input type="text" id="plural2"
                        placeholder="Plural">

                    <input type="text" id="example2"
                        placeholder="Beispielsatz">

                </div>



                <!-- WORD 3 -->

                <div class="word-row">

                    <input type="text" id="german3"
                        placeholder="Deutsch">

                    <input type="text" id="english3"
                        placeholder="English">

                    <input type="text" id="plural3"
                        placeholder="Plural">

                    <input type="text" id="example3"
                        placeholder="Beispielsatz">

                </div>



                <!-- WORD 4 -->

                <div class="word-row">

                    <input type="text" id="german4"
                        placeholder="Deutsch">

                    <input type="text" id="english4"
                        placeholder="English">

                    <input type="text" id="plural4"
                        placeholder="Plural">

                    <input type="text" id="example4"
                        placeholder="Beispielsatz">

                </div>



                <!-- WORD 5 -->

                <div class="word-row">

                    <input type="text" id="german5"
                        placeholder="Deutsch">

                    <input type="text" id="english5"
                        placeholder="English">

                    <input type="text" id="plural5"
                        placeholder="Plural">

                    <input type="text" id="example5"
                        placeholder="Beispielsatz">

                </div>


            </div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    class="save-button"
                    onclick="saveWords()"
                >
                    💾 Wörter speichern
                </button>


                <button
                    class="cancel-button"
                    onclick="hideAddWords()"
                >
                    ❌ Abbrechen
                </button>

            </div>


        </section>



        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="🔍 Suche nach Deutsch, English, Plural oder Thema..."
            >

        </section>



        <!-- =========================
             FILTERS
        ========================== -->

        <section class="filters">

            <button onclick="showAll()">
                📚 Alle Wörter
            </button>

            <button onclick="showTopics()">
                🧠 Themen
            </button>

            <button onclick="showDays()">
                📅 Tage
            </button>

        </section>



        <!-- =========================
             STATISTICS
        ========================== -->

        <section class="statistics">

            <div class="stat-card">

                <strong id="wordCount">0</strong>

                <span>Wörter angezeigt</span>

            </div>

        </section>



        <!-- =========================
             VOCABULARY
        ========================== -->

        <section class="vocabulary-section">

            <div id="vocabulary-container"></div>

        </section>



        <!-- =========================
             NO RESULTS
        ========================== -->

        <div
            id="no-results"
            class="no-results"
            style="display: none;"
        >

            ❌ Keine Wörter gefunden.

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>🇩🇪 Mein Deutsch-Lernjournal</p>

        <p>
            Mein persönliches Lernprojekt 📚
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
