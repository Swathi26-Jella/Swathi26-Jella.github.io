<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website work properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deutsch Wortschatz</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>🇩🇪 Deutsch Wortschatz</h1>

        <p>
            Mein persönlicher deutscher Wortschatz
        </p>

        <p class="subtitle">
            Bedeutung · Plural · Beispiele · Themen · Tage
        </p>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">


        <!-- SEARCH -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="🔍 Suche nach einem Wort, Bedeutung oder Plural..."
            >

        </section>


        <!-- =========================
             FILTERS
        ========================== -->

        <section class="filters">

            <button onclick="showAll()">
                📚 Alle Wörter
            </button>

            <button onclick="showTopics()">
                🧠 Themen
            </button>

            <button onclick="showDays()">
                📅 Tage
            </button>

        </section>


        <!-- =========================
             WORD COUNT
        ========================== -->

        <section class="statistics">

            <div class="stat-card">

                <strong id="wordCount">
                    0
                </strong>

                <span>
                    Wörter
                </span>

            </div>

        </section>


        <!-- =========================
             VOCABULARY
        ========================== -->

        <section class="vocabulary-section">

            <div id="vocabulary-container">

                <!--
                    vocabulary.js will put
                    all your words here.
                -->

            </div>

        </section>


        <!-- =========================
             NO RESULTS MESSAGE
        ========================== -->

        <div
            id="no-results"
            class="no-results"
            style="display: none;"
        >

            ❌ Keine Wörter gefunden.

        </div>


    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            🇩🇪 Deutsch Wortschatz
        </p>

        <p>
            Mein persönliches Lernprojekt
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="vocabulary.js"></script>

</body>

</html>
